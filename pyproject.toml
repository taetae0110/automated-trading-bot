[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.1.0"
description = "주식 · 코인 자동매매 봇 (Upbit, Binance/ccxt, 한국투자증권 KIS, Alpaca) - 백테스트 / 모의투자 / 실거래"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "requests>=2.31",
    "PyJWT>=2.8",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
ccxt = ["ccxt>=4.3"]
yfinance = ["yfinance>=0.2.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.5",
    "freezegun>=1.4",
]
all = ["tradingbot[ccxt,yfinance,dev]"]

[project.scripts]
tradingbot = "tradingbot.cli:app"

[tool.setuptools.packages.find]
include = ["tradingbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
# 문서의 코드 블록(README/docs *.md)은 포맷 검사 대상에서 제외한다
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# BaseBroker.close() 는 의도적으로 비어 있는 non-abstract 훅 메서드 (어댑터가 필요 시 재정의)
"tradingbot/brokers/base.py" = ["B027"]
