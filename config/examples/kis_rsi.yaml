# =============================================================================
# 예시: 한국투자증권(KIS) 국내주식 일봉 RSI 과매도/과매수
#
#   - RSI(14) 가 30 을 상향 돌파하면 매수, 70 을 하향 돌파하면 매도
#   - sandbox: true 면 KIS 모의투자 서버(모의 계좌)를 사용합니다. 실거래 전 반드시 모의투자로 검증하세요
#   - 정규장 09:00~15:30 KST 에만 주문이 나가며, 장 외 시간에는 엔진이 대기합니다
#   - .env 에 KIS_APP_KEY / KIS_APP_SECRET / KIS_ACCOUNT_NO 필요 (KIS_HTS_ID 는 현재 미사용)
#   - 실행:  tradingbot run -c config/examples/kis_rsi.yaml
# =============================================================================

# 실행 모드. paper = 실제 KIS 시세로 모의 체결 (주문 없음)
mode: paper

# 브로커: 한국투자증권
broker:
  name: kis                   # KIS 어댑터
  sandbox: true               # true = 모의투자 서버 (openapivts), false = 실전 서버
  fill_timeout_sec: 60        # 주식은 체결 확인에 여유를 둠(초)
  extra: {}                   # 어댑터 추가 옵션 (보통 비움)

# 매매 대상 (KIS 표기: 6자리 종목코드)
symbols:
  - "005930"                  # 삼성전자 (따옴표로 감싸 문자열로 유지)
  - "000660"                  # SK하이닉스

# 일봉 기준
interval: 1d

# 전략: RSI
strategy:
  name: rsi                   # RSI 전략
  params:                     # 전략 파라미터
    period: 14                # RSI 기간 (Wilder 방식)
    oversold: 30              # 이 값을 상향 돌파하면 매수
    overbought: 70            # 이 값을 하향 돌파하면 매도

# 리스크 관리
risk:
  max_position_pct: 0.3       # 종목당 총자산의 30%
  max_positions: 2            # 동시 보유 최대 2종목
  stop_loss_pct: 0.05         # -5% 손절 (국내주식 일봉은 변동폭 고려해 넉넉히)
  take_profit_pct: 0.10       # +10% 익절
  trailing_stop_pct: null     # 추적 손절 사용 안 함
  max_daily_loss_pct: 0.03    # 일일 손실 한도 -3%
  min_order_value: 0          # KIS 는 최소 주문 금액 제한이 없음 (0 = 브로커 기본값)
  capital_limit: 5000000      # 계좌 전체가 아니라 500만원만 운용 기준으로 사용

# 모의투자 설정 (paper 모드)
paper:
  initial_cash: 10000000      # 시작 현금 1,000만원
  quote_currency: KRW         # 결제 통화
  fee_pct: 0.001              # 매수 수수료(0.015%) + 매도 세금(0.15%~) 을 양쪽에 나눠 근사한 값
  slippage_pct: 0.001         # 호가 단위/체결 지연 슬리피지 0.1% 가정

# 실시간 엔진
engine:
  poll_seconds: 60                        # 일봉 전략이므로 1분 주기면 충분
  candle_limit: 120                       # 일봉 120개 (RSI 워밍업 충분)
  state_file: data/state_kis_rsi.json     # 상태 파일
  close_positions_at_market_close: false  # 스윙 전략이므로 장 마감 청산 안 함
  sync_positions_on_start: true           # 시작 시 계좌 잔고와 동기화
  stale_data_minutes: 1500                # 휴장일을 감안해 25시간 이상 갱신 없을 때만 경고

# 알림 (토큰/웹훅은 .env)
notify:
  telegram:                   # 텔레그램 봇 알림
    enabled: false            # 텔레그램
  slack:                      # 슬랙 Incoming Webhook 알림
    enabled: false            # 슬랙
  discord:                    # 디스코드 Webhook 알림
    enabled: false            # 디스코드
  notify_on_signal: false     # 신호 알림 끔
  notify_on_trade: true       # 체결 알림
  notify_on_error: true       # 오류 알림
  daily_summary: true         # 일일 요약 (UTC 자정 = 09:00 KST, 다음 거래일 개장 시점에 전일 요약 발송)

# 백테스트 (KIS 일봉 또는 yfinance '005930.KS' 로 내려받은 데이터 사용)
backtest:
  start: "2024-01-01"         # 시작일
  end: null                   # 종료일 (null = 최신)
  data_dir: data/candles      # 캔들 CSV 저장 위치 (data/candles/kis/005930_1d.csv)
  initial_cash: 10000000      # 시작 자금
  fee_pct: 0.001              # 수수료+세금 근사
  slippage_pct: 0.001         # 슬리피지
  fill_on: next_open          # 다음날 시가 체결
  report_dir: reports         # 리포트 저장 위치

# 로깅
logging:
  level: INFO                 # 로그 레벨
  file: logs/kis_rsi.log      # 로그 파일
