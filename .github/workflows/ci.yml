name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: CLI 스모크 (네트워크 불필요)
        run: |
          tradingbot --version
          tradingbot strategies
          tradingbot brokers
          for f in config/config.example.yaml config/examples/*.yaml; do
            tradingbot validate-config -c "$f"
          done

      - name: pytest
        # tests/conftest.py 가 Upbit 공개 API 에서 실제 캔들을 받아 캐시한다 (GitHub 러너는 네트워크가 있으므로
        # 실제 데이터 테스트가 실행된다; 받지 못하면 해당 테스트는 skip 된다). 샘플/데모 데이터는 없다.
        env:
          PYTHONUNBUFFERED: "1"
        run: pytest -q -rs
